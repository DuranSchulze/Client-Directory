<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens copied from Scraper frontend globals.css (DESIGN.md "Metric Slate Gold"). */
:root{color-scheme:dark;--background:#1a1f24;--foreground:#dee3ea;--card:#232930;--popover:#2d353e;--primary:#ffc513;--primary-foreground:#1a1f24;--primary-text:#ffc513;--secondary:#293138;--muted-foreground:#aeb8c4;--accent:#2d353e;--destructive:#ffb4ab;--border:#4b5663;--field:#151a1f;--ring:#ffc513;--sidebar:#12171c;--sidebar-border:#2d353e;--success:#6fd3a6;--warning:#ffc513;--info:#8db4ff;--radius:.5rem}
html[data-theme=light]{color-scheme:light;--background:#f4f6f8;--foreground:#1a1f24;--card:#fff;--popover:#fff;--primary-text:#8a6500;--secondary:#eceff3;--muted-foreground:#5a6572;--accent:#e6eaef;--destructive:#c62828;--border:#dfe4ea;--field:#fff;--ring:#b58500;--sidebar:#fff;--sidebar-border:#dfe4ea;--success:#146c45;--warning:#8a5a00;--info:#1f55b8}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.app{display:flex;min-height:100vh}
/* No rule lines anywhere: depth comes from tonal tiers (DESIGN.md "Elevation & Depth"). */
:root{--lift:#2a3139;--sunk:#1e242a;--edge:#3d4651}
html[data-theme=light]{--lift:#eef1f4;--sunk:#f7f8fa;--edge:#d3d9e0}
/* Thin edge on KPI cards and the table card so they separate from the page (user request). */
/* Sidebar */
aside.sb{width:16rem;flex:none;background:var(--sidebar);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);color:var(--muted-foreground);font-weight:600;text-decoration:none;transition:background .15s,color .15s}
.nav:hover{background:var(--lift);color:var(--foreground)}
.nav.on{background:var(--accent);color:var(--foreground)}
.nav.on .icon{color:var(--primary-text)}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.sb-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);background:var(--lift)}
.av{width:32px;height:32px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
/* Main */
main{flex:1;min-width:0;padding:32px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:32px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.sub{color:var(--muted-foreground);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius);font-weight:600;background:var(--accent);transition:background .15s,transform .1s}
.btn:hover{background:var(--lift);filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--primary);color:var(--primary-foreground)}
.icon{width:16px;height:16px;flex:none}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:1rem;padding:18px 20px;text-align:left;transition:background .15s,transform .15s;overflow:hidden}
.kpi:hover{background:var(--lift);transform:translateY(-2px)}
.kpi.on{background:var(--accent);border-color:color-mix(in srgb,var(--primary) 55%,var(--edge))}
.kpi.on:after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.kpi .l{font-size:11px;color:var(--muted-foreground);font-weight:600;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.12em}
.kpi .v{font-size:36px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;font-weight:600;color:var(--muted-foreground);margin-top:4px}
.kpi .d.warn{color:var(--warning)}.kpi .d.good{color:var(--success)}.kpi .d.bad{color:var(--destructive)}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}
/* Toolbar */
.card{background:var(--card);border:1px solid var(--edge);border-radius:1rem;overflow:hidden}
.bar{display:flex;gap:12px;padding:16px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:12px;top:10px;color:var(--muted-foreground)}
.in{height:36px;width:100%;background:var(--sunk);border:0;border-radius:var(--radius);padding:0 12px;transition:box-shadow .15s,background .15s}
html:not([data-theme=light]) .in{background:var(--field)}
.search .in{padding-left:36px}
.in:hover{background:var(--lift)}
.in:focus{outline:none;box-shadow:0 0 0 2px var(--primary)}
select.in{width:auto;padding-right:28px}
kbd{font:inherit;font-size:11px;background:var(--accent);border-radius:4px;padding:0 6px;color:var(--muted-foreground);position:absolute;right:10px;top:9px}
.tabs{display:flex;gap:4px;padding:12px 16px 8px;overflow-x:auto}
.tab{padding:6px 12px;font-weight:600;color:var(--muted-foreground);border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--foreground);background:var(--lift)}
.tab.on{color:var(--primary-foreground);background:var(--primary)}
.tab .c{font-size:12px;opacity:.7;margin-left:6px;font-weight:600;font-variant-numeric:tabular-nums}
/* Table */
.tw{overflow-x:auto;padding:0 8px}
table{width:100%;border-collapse:separate;border-spacing:0 2px;min-width:920px}
/* Column headers: a stronger tonal tier than rows and foreground text; no rule line. Sorted column picks up a gold tint. */
th{font-size:12px;color:var(--foreground);font-weight:700;letter-spacing:.02em;text-align:left;padding:11px 12px;white-space:nowrap;background:var(--accent)}
html[data-theme=light] th{background:#e3e8ee}
th[aria-sort=ascending],th[aria-sort=descending]{color:var(--primary-text);background:color-mix(in srgb,var(--primary) 12%,var(--accent))}
html[data-theme=light] th[aria-sort=ascending],html[data-theme=light] th[aria-sort=descending]{background:color-mix(in srgb,var(--primary) 18%,#e3e8ee)}
th:first-child{border-radius:var(--radius) 0 0 var(--radius)}th:last-child{border-radius:0 var(--radius) var(--radius) 0}
th[data-k]{cursor:pointer}th[data-k]:hover{background:var(--lift);filter:brightness(1.12)}
td{padding:12px;vertical-align:middle;transition:background .12s}
td:last-child,#rows td:nth-child(3),#rows td:nth-child(6),#rows td:nth-child(7){white-space:nowrap}
td:first-child{border-radius:var(--radius) 0 0 var(--radius)}td:last-child{border-radius:0 var(--radius) var(--radius) 0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--lift)}
tbody tr.sel td{background:color-mix(in srgb,var(--primary) 10%,var(--card))}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.who{display:flex;align-items:center;gap:12px}
.who b{font-weight:600;display:block}
.who b .warn .icon{width:14px;height:14px;vertical-align:-2px;margin-left:4px}
.who>div:last-child{min-width:0}
.who small{color:var(--muted-foreground)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mut{color:var(--muted-foreground)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--accent);color:var(--foreground)}
.chip.active{color:var(--primary-text);background:color-mix(in srgb,var(--primary) 16%,transparent)}
.chip.inquiry{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.chip.past{color:var(--muted-foreground)}
.chip.lost{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 14%,transparent)}
.tag{display:inline-block;font-size:12px;background:var(--accent);border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;white-space:nowrap}
.steps{display:flex;gap:3px;align-items:center}
.steps i{width:18px;height:6px;border-radius:3px;background:var(--accent)}
.steps i.f{background:var(--primary)}
.steps span{margin-left:8px;font-size:12px;color:var(--muted-foreground);text-transform:capitalize}
.warn{color:var(--warning)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px 16px;color:var(--muted-foreground);font-size:12px}
.empty{padding:48px;text-align:center;color:var(--muted-foreground)}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--card);box-shadow:0 0 20px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,0,0,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:24px 24px 16px;display:flex;gap:16px;align-items:flex-start}
.dh .av{width:48px;height:48px;font-size:16px;background:var(--primary);color:var(--primary-foreground)}
.dh h2{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.db{overflow-y:auto;padding:0 24px 32px;flex:1}
.dtabs{display:flex;gap:4px;position:sticky;top:0;background:var(--card);margin:0 -24px 16px;padding:8px 24px;z-index:1}
.sec{margin-bottom:12px;background:var(--accent);border-radius:12px;padding:16px}
html[data-theme=light] .sec{background:var(--sunk)}
.sec .tag{background:var(--card)}
html[data-theme=light] .sec .tag{background:var(--accent)}
.sec h3{font-size:13px;color:var(--muted-foreground);font-weight:600;margin-bottom:12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 16px}
.kv dt{color:var(--muted-foreground)}
.kv dd a{color:var(--primary-text);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .2s}
.kv dd a:hover{background-size:100% 1px}
.alert{background:color-mix(in srgb,var(--warning) 14%,transparent);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;font-size:13px;align-items:flex-start}
.alert .icon{color:var(--warning);margin-top:2px}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pipe div{padding:10px;border-radius:var(--radius);background:var(--card);font-size:12px}
.pipe div.f{background:color-mix(in srgb,var(--primary) 22%,var(--card))}
.pipe b{display:block;text-transform:capitalize;font-size:13px}
.mini{width:100%;border-collapse:collapse;min-width:0}
.mini td,.mini th{padding:6px 0;background:none}
.mini tr.total td{padding-top:10px}
.row{display:flex;justify-content:space-between;padding:6px 0}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.tli{position:relative;margin-bottom:12px;background:var(--accent);border-radius:12px;padding:12px 14px}
html[data-theme=light] .tli{background:var(--sunk)}
.tli:before{content:"";position:absolute;left:-21px;top:16px;width:10px;height:10px;border-radius:99px;background:var(--muted-foreground)}
.tli.paid:before,.tli.payment_confirmed:before{background:var(--primary)}
.tli .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.tli p{margin-top:4px;color:var(--foreground);font-size:13px}
.conf{font-size:11px;color:var(--muted-foreground);margin-left:6px;font-weight:500}
.meta{font-size:12px;color:var(--muted-foreground);padding:4px 4px 0}
.burger{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.clear{display:none}.clear.on{display:inline-flex}
.title{display:flex;align-items:center;gap:12px}
@media (max-width:860px){
  aside.sb{position:fixed;z-index:6;transform:translateX(-100%)}
  html.ready aside.sb{transition:transform .2s cubic-bezier(.2,0,0,1)}
  aside.sb.on{transform:none}
  .burger{display:inline-flex;height:36px;width:36px;justify-content:center;padding:0}
  main{padding:16px}h1{font-size:24px}
  .top{margin-bottom:16px}
  .kpis{gap:8px;margin-bottom:16px}.kpi{padding:12px}.kpi .v{font-size:24px}.kpi .d{display:none}
  kbd{display:none}
  /* Phone: keep client, status, value; the drawer holds the rest. */
  table{min-width:0}
  #listView th:nth-child(1),#listView td:nth-child(1),#listView th:nth-child(n+4),#listView td:nth-child(n+4){display:none}
  td,th{padding:12px 10px}
  td:first-child{max-width:190px}
  .who small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .av{display:none}
  .foot span:last-child{display:none}
  .dh,.db{padding-left:16px;padding-right:16px}.dtabs{margin:0 -16px 20px;padding:0 16px}
  .kv{grid-template-columns:100px 1fr}
}
/* Forms, editing, toasts */
.btn.ghost{background:none}.btn.ghost:hover{background:var(--lift)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--destructive)}
.btn[disabled]{opacity:.5;pointer-events:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted-foreground);margin-bottom:4px}
.field .in,.field textarea{width:100%}
textarea.in{height:auto;min-height:72px;padding:8px 12px;resize:vertical;font:inherit}
.field .hint{font-size:12px;color:var(--muted-foreground);margin-top:4px}
.field .err{font-size:12px;color:var(--destructive);margin-top:4px}
.field.bad .in{box-shadow:0 0 0 2px var(--destructive)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-h h3{margin:0}
.contact{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px}
html[data-theme=light] .contact{background:#fff}
.contact .top2{display:flex;align-items:flex-start;gap:10px}
.contact .top2>div:not(.av){flex:1;min-width:0}
.contact .top2>div.acts{display:flex;gap:4px;flex:none}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--muted-foreground)}
.role.main{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary-text)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground)}
.src i{width:6px;height:6px;border-radius:99px;background:var(--info);display:inline-block}
.src.man i{background:var(--primary)}
.qrow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--card);margin-bottom:8px}
html[data-theme=light] .qrow{background:#fff}
.qrow>div:not(.av){flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--popover);color:var(--foreground);padding:10px 16px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:600;z-index:20}
html[data-theme=light] .toast{background:#1a1f24;color:#fff}
.toast.on{opacity:1;transform:translate(-50%,0)}
.quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Filters float on the page (no card): a segmented status control, then one row of pill controls. */
/* Filters: one tonal panel (no outline), two labelled layers. KPI cards own the status filter. */
.filters{background:var(--sunk);border-radius:1rem;padding:6px 16px;margin-bottom:16px}
html:not([data-theme=light]) .filters{background:#1e242a}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0}
.frow+.frow{padding-top:4px}
.flabel{width:120px;flex:none;font-size:12px;font-weight:600;color:var(--muted-foreground)}
.frow select.in{width:auto;height:32px;border-radius:8px;background:var(--card)!important;padding:0 30px 0 12px;font-size:13px}
.frow select.in:hover{background:var(--lift)!important}
.frow .clear{margin-left:auto;height:32px}
.quick{gap:4px}
.frow .qc{height:30px;padding:0 10px;background:transparent!important;font-weight:600;color:var(--muted-foreground)}
.frow .qc:hover{background:var(--lift)!important;color:var(--foreground)}
.frow .qc b{font-weight:600;font-size:12px;padding:0 6px;border-radius:999px;background:var(--accent)}
.frow .qc.on{background:color-mix(in srgb,var(--primary) 16%,transparent)!important;color:var(--primary-text);box-shadow:none}
.frow .qc.on b{background:transparent}
.ttitle{font-size:15px;font-weight:600;color:var(--muted-foreground)}
.tcount{font-size:14px;font-weight:700;color:var(--primary-text);margin-right:auto;font-variant-numeric:tabular-nums}
.bar .search{flex:0 1 260px}.bar .search .in{height:32px}.bar .search svg{top:8px}.bar kbd{top:7px}
/* Data-table card details */
th.rn,td.rn{width:36px;text-align:right;color:var(--muted-foreground);font-variant-numeric:tabular-nums;padding-right:4px}
th[data-k]:after{content:"\2195";margin-left:6px;opacity:.35;font-size:11px}
th[aria-sort=ascending]:after{content:"\2191";opacity:1;color:var(--primary-text)}
th[aria-sort=descending]:after{content:"\2193";opacity:1;color:var(--primary-text)}
.pager{display:flex;align-items:center;gap:8px}
.pager select.in{height:30px;width:auto;padding:0 26px 0 10px;border-radius:8px}
.pager .btn{height:30px}
.bar .search{flex:0 1 420px}
@media (max-width:860px){.flabel{width:100%}.frow select.in{flex:1 1 140px;min-width:0}.bar .search{flex:1 1 100%;min-width:0}}
.quick>span{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-right:4px}
.qc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--foreground);transition:background .15s,transform .1s}
html:not([data-theme=light]) .qc{background:var(--field)}
.qc:hover{background:var(--lift)}.qc:active{transform:translateY(1px)}
.qc .icon{width:14px;height:14px;color:var(--muted-foreground)}
.qc b{font-variant-numeric:tabular-nums;color:var(--muted-foreground);font-weight:600}
.qc.on{background:color-mix(in srgb,var(--primary) 20%,var(--card));box-shadow:inset 0 0 0 1.5px var(--primary)}
.qc.on .icon,.qc.on b{color:var(--primary-text)}
.qc[disabled]{opacity:.45;pointer-events:none}
.nav .n.hot{background:var(--primary);color:var(--primary-foreground);border-radius:99px;padding:0 7px;font-weight:700}
@media (max-width:860px){.form{grid-template-columns:1fr}.qrow{flex-wrap:wrap}.qrow>div:not(.av){flex:1 1 calc(100% - 50px)}.qrow select.in{width:100%!important;flex:1 1 100%}.qrow .btn{flex:1;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Excel-aligned additions */
.ptag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);vertical-align:2px;margin-left:6px}
.ent{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent);margin:0 4px 4px 0;letter-spacing:.02em}
.newtag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);margin-left:6px;vertical-align:2px}
.grp{font-size:12px;font-weight:700;color:var(--muted-foreground);margin:14px 0 8px}
.grp:first-child{margin-top:0}
.form .grp{grid-column:1/-1;margin:8px 0 0}
.pgcard{padding:8px 8px 4px}
.pgcard table{min-width:760px}
.pgcard td:nth-child(4),.pgcard td:nth-child(5){white-space:nowrap}
.okmark{color:var(--success);font-weight:700}
.badmark{color:var(--destructive);font-weight:700}
.dept{font-size:13px;font-weight:700;padding:18px 12px 6px!important}
tbody tr.grprow:hover td{background:none}
.lnk{color:var(--primary-text);text-decoration:none}.lnk:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="app">
<aside class="sb" id="sb">

/* ===== Helpers ===== */

const ENG={active:{l:"Active",c:"var(--primary)",d:"Engaged per the sheet"},inactive:{l:"Inactive",c:"var(--muted-foreground)",d:"No longer engaged"},
  new:{l:"New",c:"var(--info)",d:"Flagged NEW in the sheet"},unset:{l:"Not set",c:"var(--destructive)",d:"Engagement status blank"}};

/* Gmail link on read: candidate -> company whose contact holds one of its emails. Internal dept. mailboxes never count. */
const TEAM_EMAILS=new Set(team.flatMap(t=>t.emails));
function linked(c){const em=new Set(c.contacts.flatMap(x=>x.emails.map(e=>e.toLowerCase())));return candidates.filter(k=>(v(k,"emails")||[]).some(e=>em.has(e.toLowerCase())))}
function unlinked(){const em=new Set(companies.flatMap(c=>c.contacts.flatMap(x=>x.emails.map(e=>e.toLowerCase()))));return candidates.filter(k=>!(v(k,"emails")||[]).some(e=>em.has(e.toLowerCase())||TEAM_EMAILS.has(e)))}
function suggest(k){const d=(v(k,"emails")||[]).map(dom).find(x=>x&&!FREE.has(x));if(!d)return null;return companies.find(c=>c.contacts.some(x=>x.emails.some(e=>dom(e)===d)))||null}
/* Probity cross-check: match by any email, then by normalized name or alias. */
function probityMatch(p){
  const em=p.emails.map(e=>e.toLowerCase());
  return companies.find(c=>c.contacts.some(x=>x.emails.some(e=>em.includes(e.toLowerCase()))))
      || companies.find(c=>[c.name,c.alias,c.trade_name].some(n=>n&&nkey(n)&&nkey(n)===nkey(p.company)))||null;
}
const probityOf=c=>probity.filter(p=>probityMatch(p)===c);
function roll(c){
  const ks=linked(c);
  const stage=ks.length?ks.map(k=>v(k,"stage")).sort((a,b)=>STAGES.indexOf(b)-STAGES.indexOf(a))[0]:null;
  const pays=ks.flatMap(k=>v(k,"payments")||[]),amts=ks.flatMap(k=>v(k,"amounts")||[]).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const last=ks.map(k=>v(k,"last_contact")).filter(Boolean).sort().pop()||null;
  return {ks,stage,last,pays,amts,checks:ks.flatMap(k=>v(k,"needs_check")||[]),prob:probityOf(c)};
}

function filtered(ignoreTab,ignoreQuick){
  const q=st.q.toLowerCase();
  return companies.map(c=>({c,r:roll(c)})).filter(x=>{const {c,r}=x;
    if(!ignoreTab&&!inTab(c,st.tab))return false;
    if(st.ent&&!c.entities.includes(st.ent))return false;
    if(st.svc&&c.acctg_service!==st.svc)return false;
    if(st.sup&&c.supervisor!==st.sup)return false;
    if(st.stage&&(st.stage==="none"?r.stage:r.stage!==st.stage))return false;
    if(st.fresh&&freshOf(c)!==st.fresh)return false;
    if(!ignoreQuick&&st.quick&&!QUICK.find(k=>k[0]===st.quick)[3](x))return false;
    if(q){const hay=[c.name,c.alias,c.trade_name,c.tin,c.address,c.sec_no,...c.contacts.flatMap(x=>[x.name,...x.emails,...x.phones])].join(" ").toLowerCase();if(!hay.includes(q))return false}

}

      ${r.checks.length?`<div style="margin-bottom:12px">${r.checks.map(x=>`<div class="alert">${ICON.warn}<span>${esc(x)}</span></div>`).join("")}</div>`:""}
      <div class="sec"><h3>Engagement</h3><div class="pipe">${STAGES.map((x,j)=>`<div class="${j<=si?"f":""}"><b>${x}</b><span class="mut">${sd[x]?fmt(sd[x]):"—"}</span></div>`).join("")}</div></div>
      <div class="sec"><h3>Quotes &amp; invoices</h3>${r.amts.length?`<table class="mini"><tbody>${r.amts.map(a=>`<tr><td style="text-transform:capitalize">${a.stage}</td><td class="mut">${fmt(a.date)}</td><td class="num">${peso(a.amount)}</td></tr>`).join("")}</tbody></table>`:`<p class="mut">None on record.</p>`}</div>
      <div class="sec"><h3>Payments</h3>${r.pays.length?`<table class="mini"><tbody>${r.pays.map(p=>`<tr><td>${fmt(p.date)}</td><td class="mut">${esc(p.basis)}</td><td class="num">${peso(p.amount)}</td></tr>`).join("")}<tr class="total"><td colspan="2"><b>Total paid</b></td><td class="num"><b>${peso(r.pays.reduce((s,p)=>s+(p.amount||0),0))}</b></td></tr></tbody></table>`:`<p class="mut">No verified payments.</p>`}</div>
      <div class="sec" style="background:none;padding:0"><h3 style="padding:0 4px">Timeline</h3>${tl.length?`<div class="tl">${tl.map(t=>`<div class="tli ${t.stage}"><div class="h"><b style="color:var(--foreground);text-transform:capitalize">${t.stage.replace(/_/g," ")}</b>${fmt(t.date)} · ${esc(t.who)} · ${esc(t.mailbox)}${t.amounts?.length?` · <span class="warn">${peso(t.amounts[0].amount)}</span>`:""}</div><p>${esc(t.snippet)}</p></div>`).join("")}</div>`:`<p class="mut" style="padding:0 4px">No staged messages.</p>`}</div>`
      :`<div class="empty">No Gmail conversations match this client's contact emails yet.</div>`;
  }else{
    body=`<div class="sec"><h3>companies row</h3>${kv([["id",c.id],["created_by",esc(c.created_by)],["updated_at",fmt(c.updated_at)],["engagement",c.engagement||"null"]])}</div>
      <div class="sec"><h3>Probity rows matched</h3>${r.prob.length?r.prob.map(p=>kv([["probity.id",p.id],["listed as",esc(p.company)],["matched by",p.emails.some(e=>c.contacts.some(x=>x.emails.includes(e)))?"email":"name"]])).join(""):`<p class="mut">None.</p>`}</div>
      <div class="sec"><h3>Sensitive reveals</h3>${reveals.filter(x=>x.companyId===c.id).slice(-10).reverse().map(x=>kv([["account_no",`${esc(x.user)} · ${new Date(x.at).toLocaleString("en-PH")}`]])).join("")||`<p class="mut">None.</p>`}</div>
      <div class="sec"><h3>Linked candidates (scraper)</h3>${r.ks.length?r.ks.map(k=>kv([["candidates.id",k.id],["email_key",esc(k.email_key)],["review_state",k.review_state]])).join(""):`<p class="mut">None.</p>`}</div>`;
  }
  drawer.innerHTML=`<div class="dh"><div class="av">${ini(c.alias||c.name)||"+"}</div>
    <div style="flex:1;min-width:0"><h2 id="dName">${esc(c.name||"New client")}</h2>
      <div class="mut">${isNew?"Fill in what you know; you can add more later.":`${esc(c.alias||c.type)} · ${c.contacts.length} contact${c.contacts.length===1?"":"s"}`}</div>
      ${isNew?"":`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="chip ${e==="active"?"active":e==="inactive"?"past":"lost"}">${ENG[e].l}</span>${c.is_new?`<span class="newtag" style="margin:0">NEW</span>`:""}${r.prob.length?`<span class="ptag" style="margin:0">Probity</span>`:""}${c.entities.map(x=>`<span class="ent" style="margin:0">${esc(x)}</span>`).join("")}${r.ks.length?`<span class="chip">gmail</span>`:""}</div>`}</div>
    <button class="btn" style="padding:0 10px" id="close" aria-label="Close">${ICON.x}</button></div>
  <div class="db"><div class="dtabs">${tabsHtml}</div>${body}</div>`;
}

/* ===== Validation (mirrors BUILD.md server rules) ===== */
const RX={tin:/^\d{3}-\d{3}-\d{3}-\d{3,5}$/,email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/,url:/^(https?:\/\/|#)/};
const list=s=>(s||"").split(/[,/]/).map(x=>x.trim()).filter(Boolean);
const okPhone=p=>p.replace(/\D/g,"").length>=7;
function setErr(id,msg){const el=document.getElementById("f-"+id);if(!el)return;el.classList.toggle("bad",!!msg);el.querySelector(".err")?.remove();if(msg)el.insertAdjacentHTML("beforeend",`<div class="err">${msg}</div>`)}
const val=id=>document.getElementById("i-"+id)?.value.trim()??"";
const ownerOf=(emails,skip)=>companies.find(x=>x!==skip&&x.contacts.some(k=>k.emails.some(e=>emails.includes(e))));
function saveCompany(){
  const c=cur(),isNew=!!c._new,errs={};
  const name=val("name").replace(/\s+/g," "),tin=val("tin"),ents=list(val("ents")).map(x=>x.toUpperCase()),gd=val("gd");
  if(!name)errs.name="Registered name is required.";
  else if(companies.some(x=>x!==c&&nkey(x.name)===nkey(name)))errs.name="A client with this registered name already exists.";
  if(tin&&!RX.tin.test(tin))errs.tin="Use the format 000-000-000-000.";
  else if(tin&&companies.some(x=>x!==c&&x.tin===tin&&(x.branch_code||"")===(val("branch")||"")))errs.tin="Another client already has this TIN and branch code.";
  if(ents.some(x=>!ENTITIES.includes(x)))errs.ents="Use FILEPINO, DDS, AKASYA, MCADS UB or THS.";
  if(gd&&!RX.url.test(gd))errs.gd="Paste the full https:// link.";
  let emails=[],phones=[];
  if(isNew){emails=list(val("cemail")).map(e=>e.toLowerCase());phones=list(val("cphone"));
    if(!emails.length)errs.cemail="Add at least one email so Gmail activity can link.";
    else if(emails.some(e=>!RX.email.test(e)))errs.cemail="Check the email address.";
    else{const o=ownerOf(emails,c);if(o)errs.cemail=`This email already belongs to ${esc(o.name)}`}
    if(phones.some(p=>!okPhone(p)))errs.cphone="Check the contact number.";}
  ["name","tin","ents","gd","cemail","cphone"].forEach(k=>setErr(k,errs[k]));
  if(Object.keys(errs).length){document.querySelector(".field.bad .in")?.focus();return}
  Object.assign(c,{name,alias:val("alias")||null,trade_name:val("trade")||null,type:val("type"),entities:ents,engagement:val("eng")||null,is_new:!!val("new"),
    acctg_service:val("svc")||null,efps:val("efps")||null,supervisor:val("sup")||null,assistant:val("asst")||null,tin:tin||null,branch_code:val("branch")||null,
    rdo_code:val("rdo")||null,zip:val("zip")||null,address:val("address")||null,sec_no:val("sec")||null,incorporated:val("inc")||null,year_end:val("ye")||null,
    last_checked:val("chk")||null,remarks_billing:val("rb")||null,gd_link:gd||null,remarks_docs:val("rd")||null,updated_at:new Date().toISOString()});
  if(isNew){c.contacts=[ct(val("cname")||null,val("cdes")||null,emails,phones,"main")];delete c._new;delete c._probity;companies.unshift(c);st.draft=null;st.sel=c.id;toast("Client created");}
  else toast("Changes saved");
  st.editing=false;fillFilters();render();drawRender();
}
function contactForm(){
  ctForm.innerHTML=`<div class="contact"><div class="form">${field("nn","Name","")}${field("nd","Designation","")}${field("ne","Email *","",{hint:"Separate several with commas"})}${field("np","Contact no.","")}
    ${field("nr","Billing","cc",{opts:[["main","Main"],["cc","CC"],["none","Not on billing"]]})}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost sm" id="ctCancel">Cancel</button><button class="btn pri sm" id="ctSave">Add contact</button></div></div>`;
  document.getElementById("i-ne").focus();
}
function saveContact(){
  const c=cur(),emails=list(val("ne")).map(e=>e.toLowerCase()),phones=list(val("np")),errs={};
  if(!emails.length)errs.ne="Email is required.";else if(emails.some(e=>!RX.email.test(e)))errs.ne="Check the email address.";
  else{const o=ownerOf(emails);if(o)errs.ne=`This email already belongs to ${esc(o.name)}`}
  if(phones.some(p=>!okPhone(p)))errs.np="Check the contact number.";
  ["ne","np"].forEach(k=>setErr(k,errs[k]));if(Object.keys(errs).length)return;
  const role=val("nr");if(role==="main")c.contacts.forEach(x=>{if(x.billing_role==="main")x.billing_role="cc"});
  c.contacts.push(ct(val("nn")||null,val("nd")||null,emails,phones,role));toast("Contact added");render();drawRender();
}
function close(){drawer.classList.remove("on");scrim.classList.remove("on");const id=st.sel;st.sel=null;st.draft=null;st.editing=false;render();document.querySelector(`tr[data-id="${id}"]`)?.focus()}
let tt;const toastEl=document.getElementById("toast");function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("on"),2200)}

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const ch=e.target.closest("[data-chart]");if(ch){const k=ch.dataset.chart,v2=ch.dataset.val;st[k]=st[k]===v2?"":v2;st.page=0;render();return}
  if(e.target.id==="prev"){st.page--;render();return}if(e.target.id==="next"){st.page++;render();return}
  if(e.target.closest("[data-quick],[data-tab],th[data-k]"))st.page=0;
  const qk=e.target.closest("[data-quick]");if(qk){st.quick=st.quick===qk.dataset.quick?"":qk.dataset.quick;render();return}
  const t=e.target.closest("[data-tab]");if(t){st.tab=st.tab===t.dataset.tab&&t.classList.contains("kpi")?"all":t.dataset.tab;render();return}
  const vw=e.target.closest("[data-view]");if(vw){e.preventDefault();st.view=vw.dataset.view;sb.classList.remove("on");render();return}
  const vg=e.target.closest("[data-view-go]");if(vg){close();st.view=vg.dataset.viewGo;render();return}
  const pa=e.target.closest("[data-prob-add]");if(pa){const p=probity.find(x=>x.id===+pa.dataset.probAdd);return openNew({name:p.company.toUpperCase(),probity:p,contact:p.emails.length?ct(p.person,null,p.emails,[],"main"):null})}
  const tr=e.target.closest("tr[data-id]");if(tr){open(+tr.dataset.id,tr.dataset.tabopen);return}
  const th=e.target.closest("th[data-k]");if(th){st.dir=st.sort===th.dataset.k?-st.dir:1;st.sort=th.dataset.k;render();return}
  const dt=e.target.closest("[data-dt]");if(dt){st.dtab=dt.dataset.dt;st.editing=false;drawRender();return}
  const id=e.target.closest("button")?.id;
  if(id==="close"||e.target===scrim)return close();
  if(id==="addCompany")return openNew();
  if(id==="addProbity"||id==="addSupplier"||id==="export")return toast("Available in the real app");
  if(id==="editCo"){st.editing=true;drawRender();document.getElementById("i-name").focus();return}
  if(id==="cancelEdit"){if(cur()._new)return close();st.editing=false;drawRender();return}
  if(id==="saveCo")return saveCompany();
  if(id==="reveal"){const c=cur();reveals.push({companyId:c.id,user:"admin@company.example",at:new Date().toISOString()});const el=document.getElementById("acctNo");el.textContent=c.account_no;e.target.closest("button").disabled=true;toast("Reveal logged");
    setTimeout(()=>{if(document.getElementById("acctNo")){document.getElementById("acctNo").textContent=mask(c.account_no);document.getElementById("reveal").disabled=false}},30000);return}
  if(id==="addCt")return contactForm();
  if(id==="ctCancel"){ctForm.innerHTML="";return}
  if(id==="ctSave")return saveContact();
  const mk=e.target.closest("[data-main]");if(mk){cur().contacts.forEach(x=>x.billing_role=x.id===+mk.dataset.main?"main":x.billing_role==="main"?"cc":x.billing_role);toast("Main contact changed");drawRender();return}
  const del=e.target.closest("[data-del]");if(del){const c=cur(),x=c.contacts.find(k=>k.id===+del.dataset.del);if(!confirm(`Remove ${x.name||x.emails[0]} from ${c.name}? Gmail activity from this email will no longer show here.`))return;c.contacts=c.contacts.filter(k=>k!==x);toast("Contact removed");render();drawRender();return}
  const at=e.target.closest("[data-do-attach]");if(at){const k=candidates.find(x=>x.id===+at.dataset.doAttach),sel=document.querySelector(`[data-attach="${k.id}"]`),c=companies.find(x=>x.id===+sel.value);if(!c){sel.focus();return toast("Pick a client first")}
    c.contacts.push(ct(v(k,"name"),null,v(k,"emails"),[],"cc"));toast(`Attached to ${c.name}`);render();return}
  const nf=e.target.closest("[data-new-from]");if(nf){const k=candidates.find(x=>x.id===+nf.dataset.newFrom);return openNew({name:(v(k,"company")||"").toUpperCase(),contact:ct(v(k,"name"),null,v(k,"emails"),[],"main")})}
  if(id==="clear"||id==="clear2"){Object.assign(st,{page:0,fresh:"",tab:"all",q:"",ent:"",svc:"",sup:"",stage:"",quick:""});q.value=fStage.value="";fillFilters();render()}
  if(sb.classList.contains("on")&&!e.target.closest("#sb,#burger"))sb.classList.remove("on");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&drawer.classList.contains("on"))close();
  if(e.key==="/"&&!e.target.matches("input,textarea,select")&&st.view===""){e.preventDefault();q.focus()}
  if(e.key==="Enter"&&e.target.matches("tr[data-id]"))open(+e.target.dataset.id,e.target.dataset.tabopen);
});
q.oninput=()=>{st.q=q.value;st.page=0;render()};
document.addEventListener("change",e=>{if(e.target.id==="psize"){st.size=+e.target.value;st.page=0;render()}});
fEnt.onchange=()=>{st.ent=fEnt.value;st.page=0;render()};fSvc.onchange=()=>{st.svc=fSvc.value;st.page=0;render()};fSup.onchange=()=>{st.sup=fSup.value;st.page=0;render()};fStage.onchange=()=>{st.stage=fStage.value;st.page=0;render()};
theme.onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="light"?"dark":"light"};
burger.onclick=()=>sb.classList.toggle("on");
fillFilters();render();
requestAnimationFrame(()=>document.documentElement.classList.add("ready"));
</script>
</body>
